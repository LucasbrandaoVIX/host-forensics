[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "host-forensics"
version = "0.1.0"
description = "HoST-MoE: Host-Differential Spatio-Temporal Mixture of Experts for Unified AI-Manipulated Video Detection and Localization"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Lucas Brandão" }
]
keywords = [
    "deepfake-detection",
    "video-forensics",
    "video-manipulation-localization",
    "temporal-forgery-localization",
    "mixture-of-experts",
    "dinov3",
    "audio-visual-forensics",
]
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "einops>=0.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hub = [
    "transformers>=4.46.0",
    "timm>=1.0.11",
    "torchaudio>=2.4.0",
    "opencv-python-headless>=4.9.0",
    "safetensors>=0.4.3",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
host-detect = "host_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
