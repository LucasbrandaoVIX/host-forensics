# Offline-Safe Stand-In Configuration for Fast CPU / CI Verification & Ablation Prototyping

backbone:
  visual_name: standin-vit-compact
  visual_backend: standin
  img_size: 128
  patch_size: 16
  visual_embed_dim: 128
  visual_num_layers: 4
  tap_layers: [1, 2, 3, 4]
  adapted_layers: [2, 4]
  use_ortho_lora: true
  lora_rank: 8
  principal_subspace_rank: 16
  audio_name: standin-audio
  audio_embed_dim: 128
  audio_stride_sec: 0.25
  sample_rate: 16000

mn_stem:
  bayar_channels: 8
  srm_channels: 9
  shallow_feat_channels: 24
  corr_radius: 1
  corr_temperature: 0.1
  out_dim: 64

moe:
  bottleneck_dim: 64
  num_experts_per_pool: 4
  top_k: 2
  num_heads: 4
  dropout: 0.0
  bias_update_rate: 0.001

shdc:
  anchor_hidden_dim: 64
  sharpening_beta: 2.0
  eps: 1.0e-05

readout:
  hidden_dim: 128
  pyramid_levels: 3
  pyramid_kernel_size: 3
  soft_nms_sigma: 0.5
  max_proposals: 10
  mask_base_channels: 64
  default_far_budget: 0.05

loss:
  lambda_cls: 1.0
  lambda_polarization: 0.25
  lambda_anchor: 0.5
  lambda_tfl_focal: 1.0
  lambda_tfl_diou: 1.0
  lambda_mask_bce: 1.0
  lambda_mask_dice: 1.0
  lambda_mask_boundary: 0.5
  mil_top_host_ratio: 0.25
  mil_bottom_fake_ratio: 0.1
  mil_margin: 0.6

train:
  precision: fp32
  batch_size: 4
  grad_accum_steps: 1
  num_frames: 4
  clip_duration_sec: 2.0
  lr: 0.001
  weight_decay: 0.0005
  epochs_stage1: 2
  epochs_stage2_highres: 0
  highres_img_size: 128
  modality_dropout_prob: 0.35
  compound_degradation_prob: 0.5
  symmetric_laundering_prob: 0.15
  grad_clip_norm: 1.0
